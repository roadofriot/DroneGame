<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="neonLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Radial grid / HUD rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Crosshairs -->
  <line x1="256" y1="40" x2="256" y2="100" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="412" x2="256" y2="472" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="256" x2="100" y2="256" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
  <line x1="412" y1="256" x2="472" y2="256" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>

  <!-- Drone Arms (X configuration) -->
  <line x1="140" y1="140" x2="372" y2="372" stroke="#475569" stroke-width="18" stroke-linecap="round"/>
  <line x1="372" y1="140" x2="140" y2="372" stroke="#475569" stroke-width="18" stroke-linecap="round"/>
  <line x1="140" y1="140" x2="372" y2="372" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="372" y1="140" x2="140" y2="372" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- 4 Motor Mounts & Propeller Discs -->
  <!-- Motor 0: Front-Left (140, 140) -->
  <circle cx="140" cy="140" r="54" fill="#00f2fe" fill-opacity="0.15" stroke="#00f2fe" stroke-width="3" filter="url(#glow)"/>
  <circle cx="140" cy="140" r="16" fill="#1e293b" stroke="#00f2fe" stroke-width="4"/>
  <circle cx="140" cy="140" r="6" fill="#38bdf8"/>

  <!-- Motor 1: Front-Right (372, 140) -->
  <circle cx="372" cy="140" r="54" fill="#00f2fe" fill-opacity="0.15" stroke="#00f2fe" stroke-width="3" filter="url(#glow)"/>
  <circle cx="372" cy="140" r="16" fill="#1e293b" stroke="#00f2fe" stroke-width="4"/>
  <circle cx="372" cy="140" r="6" fill="#38bdf8"/>

  <!-- Motor 2: Rear-Left (140, 372) -->
  <circle cx="140" cy="372" r="54" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="3" filter="url(#glow)"/>
  <circle cx="140" cy="372" r="16" fill="#1e293b" stroke="#10b981" stroke-width="4"/>
  <circle cx="140" cy="372" r="6" fill="#34d399"/>

  <!-- Motor 3: Rear-Right (372, 372) -->
  <circle cx="372" cy="372" r="54" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="3" filter="url(#glow)"/>
  <circle cx="372" cy="372" r="16" fill="#1e293b" stroke="#10b981" stroke-width="4"/>
  <circle cx="372" cy="372" r="6" fill="#34d399"/>

  <!-- Central Fuselage Body -->
  <path d="M 216 196 L 296 196 L 316 256 L 296 316 L 216 316 L 196 256 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="5" filter="url(#glow)"/>
  
  <!-- FPV Gimbal Camera -->
  <rect x="236" y="176" width="40" height="30" rx="8" fill="#020617" stroke="#00f2fe" stroke-width="3"/>
  <circle cx="256" cy="191" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="258" cy="189" r="3" fill="#ffffff"/>

  <!-- Status LED / Core -->
  <circle cx="256" cy="256" r="14" fill="#10b981" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="6" fill="#ecfdf5"/>

  <!-- Flight Direction Arrow (Forward) -->
  <polygon points="256,120 244,145 268,145" fill="#00f2fe"/>
</svg>
